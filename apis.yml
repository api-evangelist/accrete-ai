aid: accrete-ai
name: Accrete
description: 'Accrete is a dual-use enterprise and government AI company founded in
  2017 and headquartered at 17 State Street, New York, that licenses specialized Expert
  AI Agents built on its Knowledge Engine Platform. The platform compresses tacit human
  domain expertise and unstructured data into autonomously constructed knowledge graphs,
  which its agents reason over with long-term memory and multi-agent collaboration.
  Its product lines are Argus for government — supply-chain FOCI risk, narrative intelligence,
  information operations and law enforcement — and Nebula for commercial customers,
  covering IT service management and change-risk prediction (Nebula ITSM, shipped as
  a Snowflake Native App) and social narrative and brand-influence detection (Nebula
  Social). Customers include the U.S. Department of Defense, U.S. Special Operations
  Command, the U.S. Army, and Fortune 500 companies in media and entertainment, consumer
  goods and gaming. Accrete publishes no public developer API, SDK or machine-readable
  API contract; its agents are delivered as licensed products and through partner marketplaces
  such as Snowflake.'
